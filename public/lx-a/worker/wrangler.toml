name = "lexus-concierge-gemini-proxy"
main = "gemini-proxy.mjs"
compatibility_date = "2024-11-01"

# Non-secret config. Do NOT put the API key here — set it as a secret:
#   wrangler secret put GEMINI_API_KEY
[vars]
GEMINI_MODEL = "gemini-2.0-flash"
GEMINI_MAX_RPM = "10"
GEMINI_MAX_RPD = "200"
# Lock this to your site's origin in production (e.g. https://my-lexus.pages.dev)
ALLOWED_ORIGIN = "*"
